# Хостинг: Netlify. HTTPS включается платформой по умолчанию.
# Заголовки безопасности для продакшена.

[[redirects]]
  from = "http://dmitry-epoletov.netlify.app/*"
  to = "https://dmitry-epoletov.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Inline script/style нужны для однофайловых демо-SPA. frame-src 'self' — iframe прототипов.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.apk"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Disposition = "attachment"
